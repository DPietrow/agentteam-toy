[project]
name = "toyapp"
version = "0.1.0"
description = "Tiny Flask notes API used as a target for the AIEngineeringTeam agents"
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
